<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>magnet training</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<style>
body{display:flex;flex-direction:column;height:100%;overflow:hidden}
.top{display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.bar{border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px}
.row button{flex:1;padding:14px 8px}
button.big{padding:20px;font-size:18px;background:#fff;color:#000;border-color:#fff;width:100%}
button.big:disabled{background:#000;color:#fff;border-color:#3a3a3a}
#msg{min-height:3em;color:#fff}
.on{color:#fff}.off{color:var(--dim)}
</style></head><body>
<div class="top"><b id="prog">training</b><span id="status" class="off">connecting</span></div>
<div id="stage"><canvas id="c"></canvas></div>
<div class="bar">
  <div id="msg" class="dim"></div>
  <button class="big" id="ok" disabled>...</button>
  <div class="row"><button id="back">Back</button><button id="redo">Redo</button><button id="reset">Restart</button></div>
</div>
<script src="/m/train/train.js"></script>
</body></html>
